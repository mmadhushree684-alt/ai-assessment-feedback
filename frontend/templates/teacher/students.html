{% extends "base.html" %}{% block title %}Students{% endblock %}{% block content %}<main class="page"><h1>Students</h1><p class="muted">Students who have registered in the system.</p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Submissions</th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.name}}</td><td>{{s.username}}</td><td>{{s.email}}</td><td>{{s.submission_count}}</td></tr>{% endfor %}</tbody></table></div></section></main>{% endblock %}
